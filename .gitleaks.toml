# gitleaks configuration for cplieger/subflux
#
# THE DEFECT THIS FILE FIXES. The previous version carried a legacy singular
# `[allowlist]` table and NO `[extend]` block. Without `[extend]`, gitleaks
# builds its ruleset from this file alone, and this file defines no rules, so
# the secret gate matched nothing whatever the tree contained. Measured with
# gitleaks 8.30.1 against a working tree carrying a planted `ghp_` GitHub PAT:
# 0 findings with the old config, the PAT invisible; 3 findings the moment
# `useDefault = true` was added, the PAT plus two test fixtures.
# Never remove the `[extend]` block. On its own, `[[allowlists]]` allows
# nothing, because there is nothing to allow.
#
# Both CI scans pin that same scanner version: the gating working-tree pass
# (`gitleaks dir .`) in cplieger/ci's ci.yaml, and the advisory full-history
# pass (`gitleaks git .`) in security-scan.yaml. The array `[[allowlists]]`
# form below is only honored by a scanner that supports it, so downgrading
# either pin silently reopens the hole this file closes.

title = "subflux gitleaks config"

# Extend the bundled default rule set rather than redefining it.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# False positives: identifier-shaped names, not credentials
# ---------------------------------------------------------------------------
#
# The pattern exists for one rule, `generic-api-key`, which keys on the
# IDENTIFIER sitting next to a value (`key`, `token`, `secret`) rather than on
# the value's shape. That makes a placeholder named for what it is read as a
# credential.
#
#   `_test\.go$` covers the redaction tests, whose inputs are credential-shaped
#   on purpose: they feed placeholder keys and assert none reaches a log or a
#   response. A test that cannot hold a fake secret cannot test redaction.
#
# `targetRules` is load-bearing, so never simplify this to a bare `paths` list.
# Scoping to the one low-precision heuristic rule keeps every provider rule
# (github-pat, aws-access-token, private-key blocks) live over these same
# files, so a real credential pasted into a test is still caught. Measured on
# the planted PAT above: the rule-scoped form reports it and drops the
# fixtures, while a blanket path allowlist reports neither.
[[allowlists]]
description = "generic-api-key over Go test fixtures: identifier-shaped names, not credentials"
targetRules = ["generic-api-key"]
paths = [
  '''_test\.go$''',
]
