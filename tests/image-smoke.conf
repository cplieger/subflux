# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). subflux boots healthy in unconfigured mode with no
# env, so the health gate itself needs no run args.
#
# What health cannot see is the media payload this image builds from source.
# ffmpeg 8.1 and libx264 are compiled in an Alpine builder and copied into the
# distroless final stage, and the HEALTHCHECK is /subflux health, which stats a
# marker file and never invokes either binary. Measured on v0.5.32: replacing
# both ffmpeg binaries with a musl-dynamic build that cannot exec left the
# container healthy with FailingStreak 0 for 75 seconds, while every subtitle
# sync and every preview transcode was broken. That is the class smoke_verify
# below closes, by driving ffmpeg and ffprobe with the argument sets the app
# itself uses (internal/subsync/ffmpeg and previewhandlers.buildVideoArgs).
SMOKE_APP_NAME=subflux
SMOKE_TIMEOUT=90

# The health marker is written before the listener binds ("health state changed
# healthy:true" precedes "HTTP server listening" in the boot log), so healthy
# alone does not prove the HTTP surface came up. This line is the only evidence
# the harness has for it, and the wait shares the SMOKE_TIMEOUT deadline.
SMOKE_LOG_PATTERN="HTTP server listening"

# fixtures/media.mkv is 3.3 KB and carries one 16x16 H.264 track, one mono AAC
# track, and one embedded SRT track tagged eng. All three are load-bearing for
# the assertions below. It is committed rather than generated because this
# ffmpeg is configured --disable-everything --disable-avdevice: it ships no
# lavfi device and no source filter, so it cannot synthesize its own input
# (measured: -f lavfi -i testsrc fails with "Unknown input format: 'lavfi'").
SMOKE_RUN_ARGS="-v ${SMOKE_DIR}/fixtures:/fx:ro"

# Where the assertions collect each binary's output so they can inspect it.
SMOKE_WORK=$(mktemp -d)

# Release what the line above acquired: the harness's EXIT trap calls this
# after removing the container.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_WORK"
}

smoke_no() {
  printf 'FAIL: subflux %s\n' "$*" >&2
}

# The image is distroless, so there is no shell and no curl inside it. Exec
# form goes straight to execve(2) and needs neither.
smoke_ff() {
  _bin=$1
  shift
  docker exec "$SMOKE_CONTAINER" "/usr/local/bin/$_bin" "$@"
}

smoke_verify() {
  # probe.go: track detection. The app reads codec_name off this JSON to decide
  # what a file carries, so a decoder dropped from the configure line's
  # enumerated list turns every sync into a silent no-op.
  if ! smoke_ff ffprobe -v error -show_streams -print_format json \
    file:/fx/media.mkv >"$SMOKE_WORK/streams.json"; then
    smoke_no "ffprobe -show_streams failed on the fixture"
    return 1
  fi
  for codec in h264 aac subrip; do
    if ! grep -qF "\"codec_name\": \"$codec\"" "$SMOKE_WORK/streams.json"; then
      smoke_no "ffprobe reported no $codec stream; that decoder is missing from this build"
      return 1
    fi
  done
  # ffmpeg.NormalizeFFprobeLang picks the sync target from tags.language, so the
  # tag surviving the matroska demuxer is part of the contract.
  if ! grep -qF '"language": "eng"' "$SMOKE_WORK/streams.json"; then
    smoke_no "the fixture's subtitle language tag did not survive the demuxer"
    return 1
  fi

  # probe.go: duration validation, a separate ffprobe path from -show_streams.
  if ! smoke_ff ffprobe -v error -show_entries format=duration \
    -print_format json file:/fx/media.mkv >"$SMOKE_WORK/duration.json"; then
    smoke_no "ffprobe -show_entries format=duration failed"
    return 1
  fi
  if ! grep -qF '"duration"' "$SMOKE_WORK/duration.json"; then
    smoke_no "ffprobe returned no duration for the fixture"
    return 1
  fi

  # extract.go: the embedded-subtitle reference every automatic sync pulls out.
  # This is the most-used ffmpeg path in the app, and it needs the subrip
  # decoder, the srt muxer and the pipe protocol together.
  if ! smoke_ff ffmpeg -i file:/fx/media.mkv -map 0:s:0 -f srt \
    -loglevel error pipe:1 >"$SMOKE_WORK/reference.srt"; then
    smoke_no "ffmpeg subtitle extraction failed"
    return 1
  fi
  if ! grep -qF '00:00:00,100 --> 00:00:00,300' "$SMOKE_WORK/reference.srt"; then
    smoke_no "the extracted SRT lost its cue timing"
    return 1
  fi
  if ! grep -qF 'smoke line one' "$SMOKE_WORK/reference.srt"; then
    smoke_no "the extracted SRT lost its cue text"
    return 1
  fi

  # pcm.go: the 8 kHz mono PCM the audio-sync VAD consumes. The app's own
  # failure here is an empty stream ("no audio samples"), so the oracle is a
  # byte floor. 0.4s of 8 kHz mono s16le is 6400 bytes.
  if ! smoke_ff ffmpeg -i file:/fx/media.mkv -vn -f s16le -ac 1 \
    -acodec pcm_s16le -af aresample=async=1 -ar 8000 \
    -loglevel error pipe:1 >"$SMOKE_WORK/audio.pcm"; then
    smoke_no "ffmpeg PCM extraction failed"
    return 1
  fi
  _pcm=$(wc -c <"$SMOKE_WORK/audio.pcm")
  if [ "$_pcm" -lt 4000 ]; then
    smoke_no "PCM extraction produced only ${_pcm} bytes for a 0.4s track, want at least 4000"
    return 1
  fi

  # previewhandlers.buildVideoArgs, the app's only libx264 caller, with one
  # deviation: it writes a file instead of pipe:1 so the shipped ffprobe can
  # read the result back. Appearing in -encoders is not the same as encoding, so
  # the oracle is the output: codec_name proves libx264 ran, height proves the
  # scale filter ran, a frame count proves pictures came out rather than a bare
  # header, and the aac line proves the audio ENCODER is present as well (a
  # different component from the decoder asserted above).
  if ! smoke_ff ffmpeg -hide_banner -loglevel error -y -i file:/fx/media.mkv \
    -c:v libx264 -preset ultrafast -crf 30 \
    -vf scale=-2:360 -pix_fmt yuv420p \
    -profile:v baseline -level 3.0 \
    -c:a aac -ac 2 -b:a 96k \
    -movflags frag_keyframe+empty_moov+default_base_moof \
    -f mp4 /tmp/smoke-preview.mp4; then
    smoke_no "libx264 failed to transcode the fixture with the preview flag set"
    return 1
  fi
  if ! smoke_ff ffprobe -v error -count_frames \
    -show_entries stream=codec_name,height,nb_read_frames -of default=nw=1 \
    file:/tmp/smoke-preview.mp4 >"$SMOKE_WORK/preview.txt"; then
    smoke_no "ffprobe could not read the transcoded preview back"
    return 1
  fi
  for want in codec_name=h264 height=360 codec_name=aac; do
    if ! grep -qx "$want" "$SMOKE_WORK/preview.txt"; then
      smoke_no "the transcoded preview has no $want (got: $(tr '\n' ' ' <"$SMOKE_WORK/preview.txt"))"
      return 1
    fi
  done
  if ! grep -qE '^nb_read_frames=[1-9]' "$SMOKE_WORK/preview.txt"; then
    smoke_no "the transcoded preview decoded to no frames"
    return 1
  fi

  # Negative control, and it runs last because it is the only step that expects
  # a failure. The transcode arm above trusts ffmpeg's exit status to track
  # encoder availability, so ask the same command for an encoder this build
  # deliberately does not carry: the configure line enables libx264 only. If
  # this ever succeeds, either the build gained x265 or a missing encoder has
  # stopped being an error, and the arm above is no longer proving what it says.
  if smoke_ff ffmpeg -hide_banner -loglevel error -y -i file:/fx/media.mkv \
    -c:v libx265 -f mp4 /tmp/smoke-control.mp4 >/dev/null 2>&1; then
    smoke_no "ffmpeg accepted libx265, which this build does not carry; the transcode assertion above no longer discriminates"
    return 1
  fi

  printf 'subflux payload: ffmpeg and ffprobe answered every call the app makes\n'
}
