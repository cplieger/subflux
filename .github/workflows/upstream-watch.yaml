# scripts/upstream-watch.sh does the work, so CI and a local DRY_RUN=1 run
# plan the same issues. Imported entries change only through the monthly
# pin bump, which regenerates and diffs them; this job watches the rest.
name: Upstream watch

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # create, edit and reopen the upstream-watch issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Plan and apply issues for upstream changes the pattern import does not cover
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/upstream-watch.sh

  # A scheduled red otherwise reaches only the Actions tab. `needs:` must
  # list every other job in this workflow.
  notify:
    needs: watch
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: cplieger/ci/.github/workflows/notify-failure.yaml@5740f62de2224352d9072c632f6918f29912b894 # v3
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
