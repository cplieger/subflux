sonarr:
  enabled: true
  url: http://sonarr:8989
  api_key: placeholder-sonarr-key
  public_url: https://sonarr.example.com
radarr:
  enabled: true
  url: http://radarr:7878
  api_key: placeholder-radarr-key
  public_url: https://radarr.example.com
media_roots:
  - /media/tv
  - /media/movies
trusted_proxies:
  - 10.0.0.0/8
allowed_hosts:
  - subflux.example.com
poll_interval: 45s
languages:
  rules:
    - audio: fr
      subtitles:
        - code: en
          variant: forced
    - audio: ja
      subtitles:
        - code: en
          min_score: 70
          providers: [opensubtitles, animetosho]
          exclude: [yifysubtitles]
        - code: fr
          variants: [standard, forced]
  default:
    - code: en
      variant: hi
      min_score: 55
    - code: fr
embedded_subtitles:
  ignore_pgs: true
  ignore_vobsub: false
  ignore_ass: true
providers:
  hdbits:
    enabled: true
    priority: 1
    settings:
      username: placeholder-hdbits-user
      passkey: placeholder-hdbits-passkey
  opensubtitles:
    enabled: true
    priority: 2
    settings:
      username: placeholder-os-user
      password: placeholder-os-password
      api_key: placeholder-os-api-key
      use_hash: false
      include_ai_translated: true
      include_machine_translated: false
  betaseries:
    enabled: true
    priority: 3
    settings:
      token: placeholder-betaseries-token
  gestdown:
    enabled: true
    priority: 4
  subsource:
    enabled: true
    priority: 5
    settings:
      api_key: placeholder-subsource-key
  subdl:
    enabled: true
    priority: 7
    settings:
      api_key: placeholder-subdl-key
  animetosho:
    enabled: true
    priority: 8
    settings:
      anidb_client_key: placeholder-anidb-key
  yifysubtitles:
    enabled: true
    priority: 9
search:
  scan_interval: 12h
  provider_timeout: 2h
  scan_delay: 6s
  max_provider_concurrency: 3
  min_score: 40
  upgrade_enabled: true
  upgrade_window_days: 5
  exclude_arr_tags:
    - no-subflux
    - skip-subs
adaptive:
  enabled: true
  initial_delay: 3D
  max_delay: 60D
  backoff_multiplier: 3
  max_attempts: 6
post_processing:
  sync_subtitles: true
  audio_sync_fallback: true
  strip_hi: true
  strip_tags: false
  normalize_utf8: true
  normalize_endings: false
  clean_whitespace: true
  remove_empty: false
  sync_min_confidence: 0.4
auth:
  basic_enabled: true
  oidc_enabled: true
  oidc:
    issuer_url: https://auth.example.com/application/o/subflux/
    client_id: placeholder-oidc-client-id
    client_secret: placeholder-oidc-client-secret
    redirect_uri: https://subflux.example.com/api/auth/oidc/callback
  oidc_auto_redirect: false
  session_idle_timeout: 12h
  session_absolute_timeout: 5D
  check_breached_passwords: false
  webauthn_rp_id: subflux.example.com
scoring:
  weights:
    hash: 100
    source: 27
    release_group: 22
    streaming_service: 13
    video_codec: 11
    hdr: 9
    edition: 16
    season_pack: 14
backup:
  enabled: true
  frequency: 12h
  retention: 4
  path: /config/backups
logging:
  level: debug
  format: text
