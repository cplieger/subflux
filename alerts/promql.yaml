# Recommended alert rules for subflux. Prometheus / Mimir ruler (PromQL) rule
# group: subflux exposes metrics on /metrics, so scrape it and evaluate this
# group with Prometheus or the Mimir ruler; firing alerts deliver through your
# Alertmanager. Thresholds, the `for:` windows and the severity labels are
# starting points; adjust them to your deployment.
#
# The selector label is the scrape `job` YOUR config assigns, not a container
# name. The two target rules pin `job="subflux"` because they read the synthetic
# `up` series, where a bare `up == 0` would fire on every unrelated target in
# your Prometheus; set that matcher to whatever your scrape config calls
# subflux. The rules reading subflux's own metrics carry no job matcher, so add
# one if you run more than one instance.
groups:
  - name: subflux
    rules:
      # The floor under every other rule here: all of them read a subflux metric,
      # so all of them go quiet together when subflux stops being scraped.
      #
      # Two arms, because neither covers the other. `up == 0` catches a target
      # that is configured and failing, and keeps its labels. `absent(up{...})`
      # catches a target that stopped EXISTING — a dropped scrape target, a
      # removed scrape config, a deleted Kubernetes pod or ServiceMonitor —
      # where `up` has no series and `up == 0` cannot match. Use an EXACT job
      # matcher: a regex absent() form asks whether ANY matching target is up,
      # so one healthy replica masks every failed one, and its synthetic result
      # carries no job label to route on.
      - alert: SubfluxTargetDown
        expr: up{job="subflux"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux is not being scraped successfully"
          description: >
            No successful scrape of subflux for 15m, so every rule in this group
            is blind. Either the scrape is failing (container down, wrong port,
            network) or the target is gone from service discovery entirely. Set
            the job matcher to whatever your scrape config calls subflux.
      - alert: SubfluxTargetAbsent
        expr: absent(up{job="subflux"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux has no scrape target at all"
          description: >
            There is no up{job="subflux"} series, so subflux is not merely failing
            to scrape but is no longer a configured target: a dropped scrape
            target, a removed scrape config, or a deleted Kubernetes pod or
            ServiceMonitor. Every other rule in this group is blind.
      # The deadman for the scan loop. subflux can be up, scraped and answering
      # HTTP while its scheduled scan has been wedged for days, and nothing else
      # here notices.
      #
      # The uptime guard is load-bearing, not decoration. A range selector does
      # NOT require the series to have existed for the whole range: after a
      # restart, increase(subflux_scans_total[26h]) reads 0 as soon as there are
      # two samples, so without the guard this fires about `for:` after every
      # restart rather than 26h after the last scan. The guard says the process
      # has actually been up long enough for the window to mean anything.
      # subflux_configured keeps it quiet in unconfigured mode, where there is
      # no engine and no scan to miss.
      - alert: SubfluxScanStalled
        expr: >
          subflux_configured == 1
          and increase(subflux_scans_total[26h]) == 0
          and (time() - process_start_time_seconds) > 93600
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "subflux has not completed a scan in over a day"
          description: >
            subflux is configured, has been up for more than 26h, and no
            scheduled full scan has completed in that window (scan_interval
            defaults to 24h). The scheduler may be stalled, a scan may be stuck
            mid-run, or the arrs may be unreachable. Check the subflux logs and
            /api/activity. A scan that legitimately runs longer than the window
            will also trip this; widen the range and the uptime guard together
            if that is your normal.
      - alert: SubfluxHTTP5xx
        expr: sum(increase(subflux_http_requests_total{status=~"5.."}[10m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "subflux is returning HTTP 5xx"
          description: >
            subflux returned more than 5 server errors in 10m. Check upstream
            connectivity, provider config, and the subflux logs.
      - alert: SubfluxBackupStale
        expr: >
          subflux_backup_last_success_timestamp > 0
          and (time() - subflux_backup_last_success_timestamp) > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "subflux backup is stale"
          description: >
            No successful subflux backup recorded in over 48h. Check the backup
            task and the /config volume.
      # A provider that rejects its credentials is stopped after three
      # attempts so it is not hammered into a forced password reset, and it
      # stays stopped until someone fixes it. The second arm covers an
      # optional setting the provider refused while the provider keeps
      # working, such as AnimeTosho's AniDB client key.
      - alert: SubfluxProviderCredentialsRejected
        expr: >
          max by (provider) (subflux_provider_disabled) == 1
          or max by (provider) (subflux_provider_setting_rejected) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "subflux: {{ $labels.provider }} rejected a credential"
          description: >
            The provider rejected a credential and subflux stopped using it. After
            three attempts that is the whole provider, otherwise only the rejected
            optional setting. Fix it in the settings dialog and save, or use the
            provider's Test button. A disabled provider never re-enables on its
            own. A rejected optional setting also clears when the upstream accepts
            it on a later lookup.
      # The rule reads a gauge and not the write-error counter. While a folder is
      # unwritable no subtitle work happens there, so an increase() rule would
      # resolve while the share is still broken. The gauge stays at 1 until every
      # folder marked under the root passes a write test or a save.
      - alert: SubfluxMediaUnwritable
        expr: max by (root) (subflux_media_root_unwritable) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "subflux cannot write subtitle files in a folder under {{ $labels.root }}"
          description: >
            A write test or a subtitle save failed in a folder under this media
            root, and that folder has not accepted a write since. Scans and
            downloads for files in it are paused, so no subtitles are being saved
            there. The share may be mounted read-only, full, or refusing subflux's
            user. The web UI alert and the subflux log name the folder and the
            error.
      # The gauge stays at 1 until the path that failed reads again, which the
      # recheck tries every 5 minutes.
      - alert: SubfluxMediaUnavailable
        expr: max by (root) (subflux_media_root_unavailable) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "subflux cannot read the media under {{ $labels.root }}"
          description: >
            A file under this media root could not be checked. The root is
            missing or empty, or the filesystem refused or timed out. Nothing
            under it is treated as deleted, and new imports there wait until it
            can be read again. The share is probably unmounted or hung. The web
            UI alert and the subflux log name the path and the error.
