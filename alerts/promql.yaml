# Recommended alert rules for subflux.
# Scrape subflux's /metrics endpoint and load this group into your ruler.
# Firing alerts go through your Alertmanager. Thresholds, `for:` windows and
# severity labels are starting points, so adjust them to your deployment.
#
# The selector label is the scrape `job` your config assigns. The two target
# rules pin `job="subflux"` because they read the synthetic `up` series. Set
# that matcher to your scrape job name. The other rules carry no job matcher,
# so add one if you run more than one instance.
#
# Every rule after SubfluxHTTP5xx but the scan and backup rules reads
# subflux_alerts_active, which holds one series per problem subflux reports,
# labelled with the problem's kind and id. docs/monitoring.md lists each kind
# and its rule.
groups:
  - name: subflux
    rules:
      # The floor under every other rule here, which all read a subflux metric.
      # Two rules, because `up == 0` cannot match a target that no longer exists
      # and `absent()` cannot see one that is failing. Keep the job matcher exact.
      - alert: SubfluxTargetDown
        expr: up{job="subflux"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux is not being scraped successfully"
          description: >
            No successful scrape of subflux for 15m, so every rule in this group
            is blind. The container may be down, or the port or network may be
            wrong. Set the job matcher to your scrape job name.
      - alert: SubfluxTargetAbsent
        expr: absent(up{job="subflux"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux has no scrape target at all"
          description: >
            No up{job="subflux"} series exists, so subflux is no longer a
            configured scrape target. Check for a dropped target, a removed scrape
            config, or a deleted Kubernetes pod or ServiceMonitor. Every other rule
            in this group is blind.
      - alert: SubfluxHTTP5xx
        expr: sum(increase(subflux_http_requests_total{status=~"5.."}[10m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "subflux is returning HTTP 5xx"
          description: >
            subflux returned more than 5 server errors in 10m. The subflux log
            names each failed request.
      # A provider alert stands while a site's credentials are disabled, or
      # while its 1-hour cooldown follows a DNS, connection or TLS failure; the
      # next success clears it. 65m outlasts one cooldown, so an outage the
      # call after it cures stays quiet.
      - alert: SubfluxProviderUnusable
        expr: subflux_alerts_active{kind="provider"} == 1
        for: 65m
        labels:
          severity: warning
        annotations:
          summary: "subflux cannot use the subtitle site {{ $labels.id }}"
          description: >
            The site rejected its credentials, or has been unreachable for over
            an hour. Check its credentials in the settings, and whether the
            site is up.
      - alert: SubfluxMediaUnavailable
        expr: subflux_alerts_active{kind="media_root"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "subflux cannot read the media under {{ $labels.id }}"
          description: >
            A file under this media root could not be checked for 5m, so the
            share is likely unmounted or hung. Check the mount.
      - alert: SubfluxSourceUnreachable
        expr: subflux_alerts_active{kind="source"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux cannot reach the media source {{ $labels.id }}"
          description: >
            subflux has not reached this Sonarr or Radarr instance for 15m.
            Check its address, its API key and the network.
      # Each source is compared with its own instance's full scan interval,
      # so one Prometheus scraping several subflux instances judges each by
      # its own setting. A source's series starts at its scan loop's start,
      # so a source that never completes a full scan fires too.
      - alert: SubfluxScanStalled
        expr: >
          (time() - subflux_scan_last_complete_timestamp_seconds)
          > on(job, instance) group_left()
          (2 * subflux_scan_whole_interval_seconds)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "subflux has not completed a full scan of {{ $labels.source }}"
          description: >
            No full scan of this media source has completed in over two full
            scan intervals. The source may be failing every scan, or a scan
            may be stuck. The subflux log names the error.
      - alert: SubfluxStoreWriteFailing
        expr: subflux_alerts_active{kind="store"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "subflux cannot write its database"
          description: >
            The last write to /config/subflux.bolt failed and none has
            succeeded since. The /config volume may be full, read-only or
            failing. The log names the error.
      # Backups are on and none has succeeded for two backup intervals, an
      # instance that never made one included, since its last-success series
      # is 0. The uptime guard gives a fresh start an hour for its first copy.
      - alert: SubfluxBackupStale
        expr: >
          subflux_backup_enabled == 1
          and on(job, instance) (time() - subflux_backup_last_success_timestamp_seconds)
          > on(job, instance) (2 * subflux_backup_interval_seconds)
          and on(job, instance) (time() - process_start_time_seconds) > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux has not made a backup in two backup intervals"
          description: >
            Scheduled backups are on, but none has succeeded for twice the
            backup frequency. The subflux log names the error of each failed
            run; check that the backup folder is writable and has space.
      # Every other kind, so a kind added later is covered with no new rule.
      # backup is left to SubfluxBackupStale above;
      # restart_pending and auth_disabled are a restart request and a setting
      # you chose. job_records and pending_writes follow from store and
      # media_root on the same instance, so each cause pages once.
      - alert: SubfluxConditionActive
        expr: >
          subflux_alerts_active{kind!~"provider|media_root|source|store|backup|restart_pending|auth_disabled|job_records|pending_writes"} == 1
          or (subflux_alerts_active{kind="job_records"} == 1 unless on(job, instance) subflux_alerts_active{kind="store"})
          or (subflux_alerts_active{kind="pending_writes"} == 1 unless on(job, instance) subflux_alerts_active{kind="media_root"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "subflux reports a problem of kind {{ $labels.kind }}"
          description: >
            subflux has reported this problem for 15m. The id label, when set,
            names what it is about; docs/monitoring.md describes each kind.
